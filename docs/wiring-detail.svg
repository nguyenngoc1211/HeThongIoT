<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect width="1100" height="690" fill="#ffffff"/>
<text x="40" y="40" font-size="17" text-anchor="start" fill="#1f2937" font-weight="700">① Một kênh MQ-2 qua cầu chia áp (làm 6 lần cho Zone A–F)</text>
<text x="40" y="62" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">Cầu chia áp 10 kΩ + 10 kΩ đưa 0–5 V của chân AO xuống 0–2,5 V trước khi vào mux và ESP32.</text>
<rect x="40" y="90" width="190" height="150" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.8"/>
<text x="135" y="112" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">Module MQ-2</text>
<text x="222" y="139" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">VCC</text>
<circle cx="230" cy="135" r="4" fill="#6b7280"/>
<text x="222" y="169" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">GND</text>
<circle cx="230" cy="165" r="4" fill="#6b7280"/>
<text x="222" y="199" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">DO</text>
<circle cx="230" cy="195" r="4" fill="#6b7280"/>
<text x="222" y="229" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">AO</text>
<circle cx="230" cy="225" r="4" fill="#6b7280"/>
<line x1="230" y1="135" x2="300" y2="135" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
<text x="308" y="139" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">→ 5V (sạc dự phòng)</text>
<line x1="230" y1="165" x2="300" y2="165" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
<text x="308" y="169" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">→ GND chung</text>
<line x1="230" y1="195" x2="270" y2="195" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="278" y="199" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">DO: để trống</text>
<line x1="230" y1="225" x2="290" y2="225" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round"/>
<rect x="290" y="215" width="60" height="20" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="320" y="252" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">R1 = 10 kΩ</text>
<line x1="350" y1="225" x2="700" y2="225" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="440" cy="225" r="5" fill="#111827"/>
<text x="440" y="206" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">nút chia</text>
<text x="570" y="216" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">0 – 2,5 V</text>
<line x1="440" y1="225" x2="440" y2="260" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round"/>
<rect x="430" y="260" width="20" height="44" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="462" y="286" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">R2 = 10 kΩ</text>
<line x1="440" y1="304" x2="440" y2="330" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
<line x1="440" y1="330" x2="440" y2="338" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="429" y1="338" x2="451" y2="338" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="433" y1="343" x2="447" y2="343" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="437" y1="348" x2="443" y2="348" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<text x="440" y="364" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">GND</text>
<rect x="700" y="190" width="200" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="800" y="212" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">Mux #1</text>
<circle cx="700" cy="225" r="4" fill="#6b7280"/>
<text x="710" y="229" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">C0…C5</text>
<circle cx="900" cy="225" r="4" fill="#8b5cf6"/>
<text x="890" y="229" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">SIG</text>
<text x="712" y="264" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">S0–S3 ← GPIO16–19</text>
<text x="712" y="282" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">VCC → 3V3 · EN → GND</text>
<text x="712" y="300" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">GND → GND chung</text>
<line x1="900" y1="225" x2="980" y2="225" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
<rect x="980" y="190" width="90" height="70" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<circle cx="980" cy="225" r="4" fill="#8b5cf6"/>
<text x="1025" y="212" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">ESP32</text>
<text x="1025" y="246" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">GPIO34</text>
<text x="40" y="400" font-size="17" text-anchor="start" fill="#1f2937" font-weight="700">② Một LED chỉ hướng qua Mux #2 hoặc #3 (làm 17 lần)</text>
<text x="40" y="422" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">LED nối thẳng vào kênh Cn của mux, không dùng điện trở: dòng bị hạn chế bởi điện trở trong của mux.</text>
<rect x="40" y="450" width="150" height="120" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="115" y="472" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">ESP32</text>
<circle cx="190" cy="500" r="4" fill="#ec4899"/>
<text x="182" y="504" font-size="11" text-anchor="end" fill="#1f2937" font-weight="400">GPIO4 / GPIO5</text>
<circle cx="190" cy="540" r="4" fill="#14b8a6"/>
<text x="182" y="544" font-size="11" text-anchor="end" fill="#1f2937" font-weight="400">GPIO21,22,23,33</text>
<line x1="190" y1="500" x2="330" y2="500" stroke="#ec4899" stroke-width="2.4" stroke-linecap="round"/>
<line x1="190" y1="540" x2="330" y2="540" stroke="#14b8a6" stroke-width="2.4" stroke-linecap="round"/>
<rect x="330" y="450" width="200" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="430" y="472" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="700">Mux #2 hoặc #3</text>
<circle cx="330" cy="500" r="4" fill="#ec4899"/>
<text x="340" y="504" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">SIG</text>
<circle cx="330" cy="540" r="4" fill="#14b8a6"/>
<text x="340" y="544" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">S0–S3</text>
<text x="340" y="568" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">VCC → 3V3 · EN, GND → GND</text>
<circle cx="530" cy="500" r="4" fill="#16a34a"/>
<text x="520" y="504" font-size="12" text-anchor="end" fill="#1f2937" font-weight="400">Cn</text>
<line x1="530" y1="500" x2="620" y2="500" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="620,486 620,514 652,500" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
<line x1="652" y1="486" x2="652" y2="514" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
<line x1="652" y1="500" x2="720" y2="500" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
<line x1="720" y1="500" x2="720" y2="530" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
<line x1="720" y1="530" x2="720" y2="538" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="709" y1="538" x2="731" y2="538" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="713" y1="543" x2="727" y2="543" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="717" y1="548" x2="723" y2="548" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<text x="720" y="564" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">GND</text>
<text x="620" y="476" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">anode (+), chân dài</text>
<text x="734" y="504" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">cathode (−), chân ngắn → GND</text>
<text x="40" y="630" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">Mux #2: C0–C8 → LED 1–9 · Mux #3: C0–C7 → LED 10–17 (xem bảng trong docs/WIRING.md).</text>
<text x="40" y="650" font-size="12" text-anchor="start" fill="#1f2937" font-weight="400">Thử 1 LED trước khi đấu đủ 17 LED. LED xanh dương/trắng có điện áp thuận cao (~3 V) nên khó sáng với 3,3 V.</text>
</svg>
