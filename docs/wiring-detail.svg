<text x="740" y="450" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Không dùng điện trở hạn dòng; dòng qua mux ước tính 8–12 mA.</text>
<text x="740" y="470" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Thử đúng 1 LED trước khi đấu đủ 14 LED; nếu mux/ESP32 nóng, ngắt điện.</text>
<text x="740" y="500" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="start">LED hướng X → Y đặt ở phía X của cửa nối X và Y.</text>
