<line x1="490" y1="306" x2="560" y2="306" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
<text x="522" y="324" font-size="10.5" font-weight="700" fill="#8b5cf6" text-anchor="start">C0–C5</text>
<rect x="560" y="240" width="90" height="130" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="605" y="268" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">Mux #1</text>
<text x="605" y="288" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">CD74HC4067</text>
<text x="605" y="316" font-size="10" font-weight="600" fill="#8b5cf6" text-anchor="middle">SIG</text>
<text x="605" y="338" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">→ GPIO34</text>
<line x1="560" y1="306" x2="560" y2="306" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
<text x="70" y="450" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Điện áp 0–5 V ở AO còn 0–2,5 V trước khi vào mux và ADC ESP32.</text>
<text x="70" y="470" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Cần 12 điện trở 10 kΩ cho 6 kênh MQ-2 (mỗi kênh 2 điện trở).</text>
<text x="70" y="500" font-size="10.5" font-weight="600" fill="#dc2626" text-anchor="start">Lưu ý: MQ-2 cần làm nóng ~20 giây; ADC nền phải hiệu chuẩn lại.</text>
<rect x="720" y="115" width="640" height="410" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="740" y="145" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">② Một LED chỉ hướng qua CD74HC4067</text>
<rect x="760" y="190" width="150" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="835" y="218" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">ESP32</text>
<text x="835" y="240" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">GPIO4 → SIG2</text>
<text x="835" y="260" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">GPIO5 → SIG3</text>
<text x="835" y="282" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">3V3 · GND</text>
<rect x="980" y="175" width="190" height="240" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="1075" y="204" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Mux #2 / #3</text>
<text x="1075" y="222" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">CD74HC4067</text>
<text x="1075" y="252" font-size="10" font-weight="600" fill="#14b8a6" text-anchor="middle">SIG ← GPIO4/5</text>
<text x="1075" y="282" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">S0–S3 chọn kênh</text>
<text x="1075" y="316" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">C0 … C8</text>
