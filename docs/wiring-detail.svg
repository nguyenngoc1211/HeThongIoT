<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect width="1400" height="1010" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">FireRoute — Chi tiết đấu dây</text>
<text x="40" y="74" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Cầu chia áp MQ-2 · một kênh LED qua CD74HC4067 · bảng 14 LED theo cửa</text>
<text x="40" y="96" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Sơ đồ logic; đối chiếu bảng chân trong docs/WIRING.md và sơ đồ tổng quan docs/wiring-overview.svg.</text>
<rect x="40" y="115" width="640" height="410" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
<text x="60" y="145" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="start">① MQ-2 qua cầu chia áp 10 kΩ + 10 kΩ</text>
<rect x="70" y="180" width="230" height="220" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
<text x="90" y="210" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Module MQ-2</text>
<text x="90" y="234" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">VCC → 5V (sạc dự phòng)</text>
<text x="90" y="254" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">GND → GND chung</text>
<text x="90" y="274" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">DO → để trống</text>
<text x="90" y="306" font-size="12" font-weight="700" fill="#8b5cf6" text-anchor="start">AO</text>
<text x="90" y="326" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">0–5 V</text>
<line x1="300" y1="306" x2="350" y2="306" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
<polyline points="350.0,306.0 355.8,299.0 361.7,313.0 367.5,299.0 373.3,313.0 379.2,299.0 385.0,313.0 390.8,299.0 396.7,313.0 402.5,299.0 408.3,313.0 414.2,299.0 420.0,306.0" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
<text x="350" y="288" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">R1 = 10 kΩ</text>
<line x1="420" y1="306" x2="490" y2="306" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
